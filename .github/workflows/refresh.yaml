name: refresh-and-check

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (weekly while the season is off)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load Cricsheet data and apply SQL models
        run: python ingestion/load_cricsheet.py
      - name: Data quality checks
        run: python checks/run_checks.py