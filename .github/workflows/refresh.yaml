name: refresh-and-check

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC (weekly while the season is off)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load Cricsheet data into DuckDB
        run: python ingestion/load_cricsheet.py
      - name: Apply SQL models
        run: python -c "import duckdb; c=duckdb.connect('data/ipl.duckdb'); c.execute(open('sql/models.sql', encoding='utf-8').read())"
      - name: Data quality checks
        run: python checks/run_checks.py